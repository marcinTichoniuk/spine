services:
  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
    volumes:
      - ./caddy:/etc/caddy
      - ./web/dist:/srv

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spine
    volumes:
      - db-data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/spine
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

volumes:
  db-data:
